# MongoDB Kafka Source Connector.
# Reads MongoDB change stream events from shop.orders and publishes them to Kafka.

name=mongodb-source-orders
connector.class=com.mongodb.kafka.connect.MongoSourceConnector
tasks.max=1

# Set MONGODB_URI before starting Kafka Connect.
connection.uri=${env:MONGODB_URI}
database=shop
collection=orders

# Route shop.orders events to the same topic used by the Node.js example.
topic.namespace.map={"shop.orders":"mongo.orders.cdc"}

# Keep the full change event, not only fullDocument.
publish.full.document.only=false
change.stream.full.document=
change.stream.full.document.before.change=whenAvailable

# Match the hand-written Node.js producer example.
pipeline=[{"$match":{"operationType":{"$in":["insert","update","replace","delete"]}}}]

output.format.key=json
output.format.value=json
output.json.formatter=com.mongodb.kafka.connect.source.json.formatter.ExtendedJson

startup.mode=latest
poll.await.time.ms=5000
poll.max.batch.size=1000
