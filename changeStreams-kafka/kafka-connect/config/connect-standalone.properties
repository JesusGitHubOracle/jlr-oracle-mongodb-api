# Kafka Connect standalone worker configuration for the local demo.

bootstrap.servers=localhost:9092

key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.storage.StringConverter

key.converter.schemas.enable=false
value.converter.schemas.enable=false

offset.storage.file.filename=/tmp/mongo-kafka-connect.offsets
offset.flush.interval.ms=10000

# Allow connector properties to read values from environment variables.
config.providers=env
config.providers.env.class=org.apache.kafka.common.config.provider.EnvVarConfigProvider

# Add the MongoDB Kafka Connector plugin directory here.
# Example after installing with Confluent Hub:
# plugin.path=/usr/local/share/confluent-hub-components
plugin.path=./kafka-connect/plugins
